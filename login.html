<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future School - Login</title>
  <link rel="icon" href="Screenshot 2026-10-27 173319.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="brand">Future School</a>
      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="News.html">News</a></li>
        <li><a href="Activities.html">Activities</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" class="login-btn active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="login-wrapper">
    <div class="card login-card">
      <h2 class="page-title">Sign In</h2>
      <form>
        <div>
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" required placeholder="Enter email">
        </div>
        <div>
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <p class="demo-note"> Demo-only sign-in page</p>
      <div class="back-link-container">
        <a href="index.html" class="back-link"> Back to Home &rarr;</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Future School. All rights reserved.</p>
  </footer>
</body>

</html>
