<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="brand">Future School</a>
     
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="News.html">News</a></li>
        <li><a href="Activities.html">Activities</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="login.html" class="login-btn">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="container page-main">
    <h1 class="page-title">Contact Us</h1>

    <div class="contact-grid">
      <div class="card">
        <h2>Get in Touch</h2>
        <p><strong>Address:</strong> Lorem ipsum dolor sit amet.</p>
        <p><strong>Email:</strong> emil</p>
        <p><strong>Phone:</strong>+20 26473445318</p>
      </div>

      <form class="card">
        <div>
          <label for="c-name">Name</label>
          <input type="text" id="c-name" name="name" required placeholder="Your Name">
        </div>
        <div>
          <label for="c-email">Email</label>
          <input type="email" id="c-email" name="email" required placeholder="Your Email">
        </div>
        <div>
          <label for="c-subject">Subject</label>
          <input type="text" id="c-subject" name="subject" required placeholder="Subject">
        </div>
        <div>
          <label for="c-message">Message</label>
          <textarea id="c-message" name="message" rows="4" required placeholder="Your message..."></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Future School. All rights reserved.</p>
  </footer>
</body>
